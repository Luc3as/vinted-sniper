{% extends "base.html" %}
{% block title %}Sign in · vinted-sniper{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<section class="login-wrap">
  {% include "_wordmark.svg" %}
  <div class="card">
    {% if error %}<p class="error" id="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="access_token">Password</label>
      <input type="password" id="access_token" name="access_token"
             autocomplete="current-password" autofocus required
             {% if retry_after %}disabled{% endif %}>
      <button type="submit" id="login-submit" style="width:100%; margin-top:1rem;"
              {% if retry_after %}disabled{% endif %}>Sign in</button>
    </form>
  </div>
</section>
{% if retry_after %}
<script>
  (function () {
    let left = {{ retry_after }};
    const msg = document.getElementById("login-error");
    const field = document.getElementById("access_token");
    const btn = document.getElementById("login-submit");
    const tick = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(tick);
        msg.textContent = "You can try again now.";
        field.disabled = false;
        btn.disabled = false;
        field.focus();
        return;
      }
      msg.textContent = "Too many attempts. You can try again in " + left + " seconds.";
    }, 1000);
  })();
</script>
{% endif %}
{% endblock %}
